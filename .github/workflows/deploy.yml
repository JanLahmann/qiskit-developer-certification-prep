name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Quality gate: nothing deploys unless every proof re-executes cleanly and
  # no answer-revealing meta-pattern exists. The drift lint is advisory
  # (heuristic; findings need human judgment).
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - name: Install pinned stack
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r pipeline/requirements.lock
      - name: Re-prove question bank
        run: .venv/bin/python pipeline/verify_bank.py --check --jobs 4
      - name: Meta-pattern audit gate
        run: .venv/bin/python pipeline/audit_meta_patterns.py --gate
      - name: Figure freshness gate
        run: .venv/bin/python pipeline/render_figures.py --check
      - name: Proof/option drift lint (advisory)
        continue-on-error: true
        run: .venv/bin/python pipeline/lint_proof_drift.py

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements-build.txt
      - name: Install builder deps (no Qiskit — builders only read data/)
        run: pip install -q -r pipeline/requirements-build.txt
      - name: Generate site data + cram pages + Anki decks + EPUB
        run: |
          python pipeline/build_site_data.py
          python pipeline/build_study.py
          python pipeline/build_anki.py
          python pipeline/build_epub.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Build site
        working-directory: site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
